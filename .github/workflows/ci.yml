name: Comprehensive Test Suite CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  android-tests:
    name: Android App Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Run Android unit tests
      working-directory: ./android
      run: ./gradlew test --stacktrace
      
    - name: Generate test coverage report
      working-directory: ./android
      run: ./gradlew testDebugUnitTestCoverage
      
    - name: Upload Android test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: android-test-results
        path: |
          android/app/build/reports/tests/
          android/app/build/reports/coverage/
          
    - name: Upload Android coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: android/app/build/reports/coverage/test/debug/report.xml
        flags: android
        name: android-coverage

  windows-controller-tests:
    name: Windows Controller Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
        
    - name: Install Python dependencies
      working-directory: ./windows_controller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        
    - name: Run Windows controller tests with coverage
      working-directory: ./windows_controller
      run: |
        export QT_QPA_PLATFORM=offscreen
        python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing
        
    - name: Upload Windows test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: windows-test-results
        path: |
          windows_controller/htmlcov/
          windows_controller/coverage.xml
          windows_controller/.coverage
          
    - name: Upload Windows coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: windows_controller/coverage.xml
        flags: windows
        name: windows-coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [android-tests, windows-controller-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0
        
    - name: Install Python dependencies
      working-directory: ./windows_controller
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build Android APK for integration testing
      working-directory: ./android
      run: ./gradlew assembleDebug
      
    - name: Run integration tests
      working-directory: ./windows_controller
      run: |
        export QT_QPA_PLATFORM=offscreen
        python -m pytest tests/test_sdk_integrations.py -v --tb=short
        
    - name: Upload integration test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: integration-test-results
        path: windows_controller/integration-test-results/

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [android-tests, windows-controller-tests, integration-tests]
    if: always()
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      
    - name: Display test summary
      run: |
        echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
        echo "### Android Tests" >> $GITHUB_STEP_SUMMARY
        if [ -d "android-test-results" ]; then
          echo "✅ Android tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Android tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "### Windows Controller Tests" >> $GITHUB_STEP_SUMMARY
        if [ -d "windows-test-results" ]; then
          echo "✅ Windows controller tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Windows controller tests failed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "### Integration Tests" >> $GITHUB_STEP_SUMMARY
        if [ -d "integration-test-results" ]; then
          echo "✅ Integration tests completed" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Integration tests failed" >> $GITHUB_STEP_SUMMARY
        fi