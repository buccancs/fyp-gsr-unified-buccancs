# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
android.buildToolsVersion=35
# SDK and build tools versions
# These can be overridden by local.properties if needed
android.compileSdkVersion=35
android.minSdkVersion=24
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.targetSdkVersion=35
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Kotlin compiler settings
kotlin.compiler.execution.strategy=in-process
# Enable Gradle build cache
org.gradle.caching=true
# Enable configuration cache
org.gradle.configuration-cache=true
# Specifies the Java home for Gradle daemon
# IMPORTANT: Android Gradle plugin requires Java 17 or higher
# OS-specific Java home paths - uncomment the appropriate one for your system:
# Local Java installations in environments folder (OS-specific)
# The setup scripts will download and configure Java locally
# Multiple JDK versions are supported: JDK 21 (default) and JDK 24
# JDK 21 installations (default)
# macOS local Java 21 installation
org.gradle.java.home.macos=environments/pc/macos/java21
# Windows local Java 21 installation
org.gradle.java.home.windows=environments/pc/windows/java21
# Linux local Java 21 installation
org.gradle.java.home.linux=environments/pc/linux/java21
# JDK 24 installations (alternative)
# Uncomment these lines to use JDK 24 instead of JDK 21
# org.gradle.java.home.macos=environments/pc/macos/java24
# org.gradle.java.home.windows=environments/pc/windows/java24
# org.gradle.java.home.linux=environments/pc/linux/java24
# Default Java home (symlink to JDK 21)
# macOS default Java installation
org.gradle.java.home.macos.default=./environments/pc/macos/java
# Windows default Java installation
org.gradle.java.home.windows.default=./environments/pc/windows/java
# Linux default Java installation
org.gradle.java.home.linux.default=./environments/pc/linux/java
# Auto-detect OS and set appropriate Java home
# This will be overridden by the build system based on the detected OS
# Default to Windows path (will be auto-detected during build)
# org.gradle.java.home=environments/pc/windows/java
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# 
# To find your Java installations on macOS:
# /usr/libexec/java_home -V
# 
# Example paths:
# macOS with Homebrew: /opt/homebrew/Cellar/openjdk@17/17.x.x/libexec/openjdk.jdk/Contents/Home
# macOS with Oracle JDK: /Library/Java/JavaVirtualMachines/jdk-17.jdk/Contents/Home
# org.gradle.java.home=/path/to/your/java17/installation
# NOTE: Android Gradle plugin requires Java 17 or higher for best compatibility
# JDK 21 and 24 are both supported and available locally
# To install Java 17 on macOS with Homebrew:
#   brew install openjdk@17
# Then find the installation path with:
#   /usr/libexec/java_home -V
# And uncomment the line above with the correct path
# Local Gradle installation paths (optional - gradlew is preferred)
# Windows local Gradle installation
gradle.home.windows=./environments/pc/windows/gradle
# macOS local Gradle installation  
gradle.home.macos=./environments/pc/macos/gradle
# Linux local Gradle installation
gradle.home.linux=./environments/pc/linux/gradle
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
