# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# SDK and build tools versions
android.buildToolsVersion=35
android.compileSdkVersion=35
android.minSdkVersion=24
android.targetSdkVersion=35

# Enables namespacing of each library's R class.
android.nonTransitiveRClass=true
# Use AndroidX libraries.
android.useAndroidX=true

# Kotlin code style for this project.
kotlin.code.style=official
# Kotlin compiler settings.
kotlin.compiler.execution.strategy=in-process

# Gradle build performance settings
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.parallel=false

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# -----------------------------------------------------------------------------
# Local Environment Configuration
# -----------------------------------------------------------------------------
# The project contains local installations of required tools (JDK, Gradle)
# within the /environments directory, organized by OS and architecture.
# The build scripts will automatically select the correct path based on the
# host operating system.

# Java home paths (JDK). Android Gradle Plugin requires Java 17 or higher.
org.gradle.java.home.windows=environments/windows-x86_64/java
org.gradle.java.home.macos=environments/macos-arm64/java
org.gradle.java.home.linux=environments/linux-x86_64/java

# Gradle home paths (optional, as gradlew is preferred).
gradle.home.windows=environments/windows-x86_64/gradle
gradle.home.macos=environments/macos-arm64/gradle
gradle.home.linux=environments/linux-x86_64/gradle
